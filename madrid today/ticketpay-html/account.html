<script>
  const supabaseUrl = 'https://crixlmnrpbjxcflcxpbf.supabase.co';
  const supabaseAnonKey = 'sb_publishable_rbE4Y8tl9HMPwe8Wh60yaA_MF5yGq9P';

</head>
<body>

<!-- ... header (same) ... -->

<!-- ... main content (same) ... -->

<footer class="site-footer">
  <!-- ... footer (same) ... -->
</footer>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script>
  // Language switcher
  function setLanguage(lang) {
    document.documentElement.lang = lang;
    const eyebrow = document.getElementById("dash-eyebrow");
    const greeting = document.getElementById("dash-greeting");
    if (lang === "es") {
      eyebrow.textContent = "TU CUENTA";
      greeting.textContent = "Bienvenido de nuevo";
    } else {
      eyebrow.textContent = "YOUR ACCOUNT";
      greeting.textContent = "Welcome back";
    }
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });
    try { localStorage.setItem('tm_lang', lang); } catch (e) {}
  }

  // Initialize language
  const savedLang = (function(){ try { return localStorage.getItem('tm_lang') || 'en'; } catch (e) { return 'en'; } })();
  setLanguage(savedLang);

  // Auth check (async)
  (async () => {
    const user = await Auth.get();
    if (!user) {
      window.location.href = "login.html";
    } else {
      document.getElementById("dash-greeting").textContent = `Hi, ${user.user_metadata?.name || user.email.split("@")[0]}`;
    }

    // Stats (async)
    const orders = await Orders.all();
    document.getElementById("stat-orders").textContent = orders.length;
    const totalTickets = orders.reduce((sum, o) => sum + (o.metadata?.ticketCount || 0), 0);
    document.getElementById("stat-tickets").textContent = totalTickets;
    const totalSpend = orders.reduce((sum, o) => sum + o.total, 0);
    document.getElementById("stat-spend").textContent = formatEUR(totalSpend);

    // Orders list
    const list = document.getElementById("orders-list");
    if (orders.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <h3>No orders yet</h3>
          <p>When you complete a checkout, your order will appear here.</p>
          <div style="margin-top:18px;"><a href="event.html" class="btn btn-primary btn-sm">Browse Madrid tickets</a></div>
        </div>`;
    } else {
      list.innerHTML = orders.map((o) => {
        const meta = o.metadata || {};
        return `
          <div class="order-row">
            <div class="order-meta">
              <strong>${meta.summary || "Order"}</strong>
              <span>${new Date(o.created_at).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })} · ${meta.ticketCount || 0} ticket${(meta.ticketCount || 0) > 1 ? "s" : ""} · #${meta.code || o.id.slice(0,6)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:16px;">
              <span class="badge">CONFIRMED</span>
              <span class="order-price">${formatEUR(o.total)}</span>
            </div>
          </div>`;
      }).join("");
    }

    // Signout (async)
    document.getElementById("signout-btn").addEventListener("click", async () => {
      await Auth.signOut();
      window.location.href = "index.html";
    });
  })();
</script>
</body>
</html>
