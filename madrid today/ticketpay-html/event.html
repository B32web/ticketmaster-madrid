<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Weeknd · After Hours Til Dawn — Madrid | Ticketmaster</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/pages.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseUrl = 'https://crixlmnrpbjxcflcxpbf.supabase.co';
  const supabaseAnonKey = 'sb_publishable_rbE4Y8tl9HMPwe8Wh60yaA_MF5yGq9P';
  const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

<style>
  /* ... same styles as before ... */
  #package-banner {
    display: none;
    background: #eaf3ff;
    border: 1px solid #bcdcff;
    color: #0a4b95;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 13.5px;
    font-weight: 600;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand"><span class="tm-logo"><span class="tm-logo-mark">®</span><span>ticketmaster</span></span></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="event.html" class="active">Madrid Event</a>
      <a href="tickets.html">My Tickets</a>
    </nav>
    <div class="header-actions">
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="es" onclick="setLanguage('es')">ES</button>
        <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
      </div>
      <div id="header-auth-slot"></div>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <!-- Breadcrumb -->
    <div class="breadcrumb-wrap">
      <nav class="breadcrumb"><a href="index.html">Home</a> / <a href="#">Music</a> / <a href="#">Madrid</a> / <span>The Weeknd</span></nav>
    </div>

    <!-- Event Hero -->
    <section class="event-hero">
      <img src="images/concert/weeknd1-performance.jpg" alt="The Weeknd performing" />
      <div class="event-hero-overlay"></div>
      <div class="event-hero-content">
        <div class="eyebrow">Madrid · Live Concert</div>
        <h1>The Weeknd</h1>
        <p>After Hours Til Dawn Tour · Madrid</p>
      </div>
    </section>

    <!-- Seat Map Section -->
    <section class="section" id="seats">
      <div class="section-head">
        <h2 class="font-display">Select Your Seats</h2>
        <span class="availability-note" id="seatAvailability"></span>
      </div>

      <div id="package-banner"></div>

      <div id="stadium-container">
        <svg id="stadium-svg" viewBox="0 0 1000 700"></svg>
        <div id="map-controls">
          <button onclick="zoomIn()">+</button>
          <button onclick="zoomOut()">−</button>
          <button onclick="resetZoom()">⟳</button>
        </div>
      </div>

      <div id="bottom-bar">
        <div>
          <strong id="selected-count">0 seats selected</strong>
          <span id="selected-total" style="color:#666; margin-left:10px;">€0</span>
        </div>
        <button id="proceed-btn" disabled>Get Your Ticket</button>
      </div>
    </section>
  </div>
</main>

<footer class="site-footer">
  <!-- ... footer ... -->
</footer>

<!-- Tooltip -->
<div class="tooltip" id="tooltip">
  <div class="tooltip-title" id="tooltip-title"></div>
  <div class="tooltip-row" id="tooltip-row"></div>
  <div class="tooltip-price" id="tooltip-price"></div>
</div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script>
  function setLanguage(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
    try { localStorage.setItem('tm_lang', lang); } catch (e) {}
  }
  setLanguage((function(){ try { return localStorage.getItem('tm_lang') || 'es'; } catch (e) { return 'es'; } })());

  // ===== Parse URL parameters =====
  const urlParams = new URLSearchParams(window.location.search);
  let packageCtx = null;
  if (urlParams.get('tier') && urlParams.get('qty')) {
    const tierId = urlParams.get('tier');
    const day = urlParams.get('day') || 'sun';
    const qty = parseInt(urlParams.get('qty'), 10) || 1;
    const tierInfo = TIERS.find(t => t.id === tierId);
    packageCtx = { day, tier: tierId, tierName: tierInfo ? tierInfo.name : 'Ticket', qty, pricePerTicket: tierInfo ? tierInfo.price : 0 };
    // Also store in localStorage for checkout
    Cart.setPackage(packageCtx);
  } else {
    packageCtx = Cart.getPackage() || { day: 'sun', tier: null, qty: 0 };
  }

  // Show package banner
  const banner = document.getElementById('package-banner');
  if (packageCtx && packageCtx.qty > 0) {
    banner.style.display = 'block';
    const dayInfo = DAYS.find(d => d.id === packageCtx.day);
    banner.textContent = `You selected: ${packageCtx.tierName} × ${packageCtx.qty} (${dayInfo ? dayInfo.weekday : 'Sunday'}). Choose ${packageCtx.qty} seat(s) below.`;
  } else {
    banner.style.display = 'none';
  }

  // ===== SEAT MAP (Fully Interactive) =====
  const svg = document.getElementById('stadium-svg');
  const tooltip = document.getElementById('tooltip');
  const tooltipTitle = document.getElementById('tooltip-title');
  const tooltipRow = document.getElementById('tooltip-row');
  const tooltipPrice = document.getElementById('tooltip-price');
  const selectedSeats = new Map();
  const maxSeatsToSelect = packageCtx && packageCtx.qty > 0 ? packageCtx.qty : 6;

  // Use TIERS from data.js
  const sections = TIERS.map((tier) => ({
    id: tier.id,
    name: tier.name,
    price: tier.price,
    remaining: tier.remaining
  }));

  // Draw Overview (Stadium)
  function renderOverview() {
    svg.innerHTML = '';
    // Stage
    svg.innerHTML += `<rect x="450" y="30" width="100" height="30" rx="5" fill="#1F262D" /><text x="500" y="50" text-anchor="middle" fill="#fff" font-size="14">STAGE</text>`;

    // Draw sections around stage
    const cols = 4;
    const rows = 3;
    let index = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (index >= sections.length) break;
        const sec = sections[index];
        const x = 50 + c * 220;
        const y = 100 + r * 150;
        svg.innerHTML += `
          <g class="section-block available" data-section-id="${sec.id}" data-price="${sec.price}" data-name="${sec.name}" data-remaining="${sec.remaining}" onclick="openSection('${sec.id}')">
            <rect x="${x}" y="${y}" width="200" height="130" rx="10" fill="#3E8BFF" />
            <text x="${x+100}" y="${y+70}" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">${sec.name}</text>
            <text x="${x+100}" y="${y+100}" text-anchor="middle" fill="#fff" font-size="12">${sec.remaining} seats</text>
          </g>`;
        index++;
      }
    }
    updateSummary();
    document.getElementById('seatAvailability').textContent = (sections.reduce((a, b) => a + b.remaining, 0)) + ' tickets available';
  }

  // Open a section to select seats
  function openSection(sectionId) {
    const sec = sections.find(s => s.id === sectionId);
    if (!sec) return;
    svg.innerHTML = '';
    // Back button
    svg.innerHTML += `<text x="50" y="50" fill="#026cdf" font-size="20" style="cursor:pointer;" onclick="renderOverview()">← Back</text>`;
    // Section title
    svg.innerHTML += `<text x="500" y="50" text-anchor="middle" fill="#333" font-size="18" font-weight="bold">${sec.name} · €${sec.price}</text>`;

    // Generate seats randomly within the section area
    const seatCount = sec.remaining;
    const bookedSeats = 20;
    const seatAreaW = 700;
    const seatAreaH = 450;
    const seatW = 60;
    const seatH = 50;
    const startX = (1000 - seatAreaW) / 2;
    const startY = 120;

    for (let i = 0; i < seatCount + bookedSeats; i++) {
      let x = startX + Math.random() * (seatAreaW - seatW);
      let y = startY + Math.random() * (seatAreaH - seatH);
      const isAvailable = i < seatCount;
      const seatId = `${sectionId}-seat-${i+1}`;
      const seatNumber = i + 1;
      const locationLabel = ["Left", "Right", "Front", "Back", "Center", "Aisle"][Math.floor(Math.random() * 6)];
      svg.innerHTML += `
        <g class="seat ${isAvailable ? 'available' : 'unavailable'}" data-seat-id="${seatId}" data-price="${sec.price}" data-name="${sec.name}" data-number="${seatNumber}" data-location="${locationLabel}" ${isAvailable ? `onclick="toggleSeat('${seatId}')" onmouseover="showTooltip(event, '${sec.name}', 'Seat ${seatNumber}', '${locationLabel}', '${sec.price}')" onmouseout="hideTooltip()"` : ''}>
          <rect x="${x}" y="${y}" width="${seatW}" height="${seatH}" rx="8" fill="${isAvailable ? '#3E8BFF' : '#4C5668'}" />
          <text x="${x+seatW/2}" y="${y+22}" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">${seatNumber}</text>
          <text x="${x+seatW/2}" y="${y+40}" text-anchor="middle" fill="#fff" font-size="10">${locationLabel}</text>
          ${!isAvailable ? `<text x="${x+seatW/2}" y="${y+70}" text-anchor="middle" fill="#fff" font-size="9">BOOKED</text>` : ''}
        </g>`;
    }
    updateSummary();
  }

  // Toggle seat selection
  function toggleSeat(seatId) {
    const seatEl = document.querySelector(`[data-seat-id="${seatId}"]`);
    if (!seatEl || !seatEl.classList.contains('available')) return;
    if (selectedSeats.has(seatId)) {
      selectedSeats.delete(seatId);
      seatEl.classList.remove('selected');
      seatEl.classList.add('available');
      seatEl.querySelector('rect').style.fill = '#3E8BFF';
    } else {
      if (selectedSeats.size >= maxSeatsToSelect) {
        alert('You can only select ' + maxSeatsToSelect + ' seat(s).');
        return;
      }
      selectedSeats.set(seatId, {
        seatId,
        price: parseFloat(seatEl.dataset.price),
        name: seatEl.dataset.name,
        number: seatEl.dataset.number,
        location: seatEl.dataset.location
      });
      seatEl.classList.remove('available');
      seatEl.classList.add('selected');
      seatEl.querySelector('rect').style.fill = '#FFB81C';
    }
    updateSummary();
  }

  // Update summary
  function updateSummary() {
    const count = selectedSeats.size;
    let total = 0;
    selectedSeats.forEach((seat) => { total += seat.price; });
    document.getElementById('selected-count').textContent = count + ' seat' + (count !== 1 ? 's' : '') + ' selected';
    document.getElementById('selected-total').textContent = '€' + total.toFixed(2);
    document.getElementById('proceed-btn').disabled = count !== maxSeatsToSelect;
  }

  // Proceed button
  document.getElementById('proceed-btn').addEventListener('click', () => {
    if (selectedSeats.size !== maxSeatsToSelect) return;
    const seatList = [];
    selectedSeats.forEach((seat) => {
      seatList.push({
        section: seat.seatId.split('-')[0],
        row: seat.location,
        seat: seat.number,
        price: seat.price,
        sectionName: seat.name,
        tierLabel: seat.name
      });
    });
    Cart.setSeats(seatList);
    Cart.setPackage(packageCtx);
    window.location.href = 'checkout.html';
  });

  // Tooltip
  function showTooltip(event, name, row, seat, price) {
    tooltipTitle.textContent = name;
    tooltipRow.textContent = 'Seat ' + row + ' · ' + seat;
    tooltipPrice.textContent = '€' + price;
    tooltip.style.display = 'block';
    tooltip.style.left = (event.clientX + 15) + 'px';
    tooltip.style.top = (event.clientY + 15) + 'px';
  }
  function hideTooltip() {
    tooltip.style.display = 'none';
  }

  // Zoom controls
  let zoom = 1;
  function zoomIn() { zoom = Math.min(2, zoom + 0.2); svg.style.transform = `scale(${zoom})`; }
  function zoomOut() { zoom = Math.max(0.6, zoom - 0.2); svg.style.transform = `scale(${zoom})`; }
  function resetZoom() { zoom = 1; svg.style.transform = `scale(1)`; }

  // Init
  renderOverview();
</script>
</body>
</html>
