<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account | Ticketmaster</title>
<style>
  :root {
    --tm-blue: #026cdf;
    --tm-blue-dark: #0154a8;
    --tm-ink: #151515;
    --tm-border: #e3e5e8;
    --tm-bg: #f5f6f8;
    --tm-muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--tm-bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--tm-ink);
  }

  /* ---------- Header ---------- */
  .site-header {
    background: #fff;
    border-bottom: 1px solid var(--tm-border);
  }
  .site-header .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand { text-decoration: none; }
  .tm-logo {
    font-size: 19px;
    font-style: italic;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--tm-blue);
    transform: skewX(-7deg);
    display: inline-flex;
    align-items: flex-start;
  }
  .tm-logo-mark {
    font-size: 9px;
    font-weight: 700;
    margin-right: 2px;
    transform: skewX(7deg);
  }
  .main-nav {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }
  .main-nav a {
    color: var(--tm-ink);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 600;
  }
  .main-nav a:hover { color: var(--tm-blue); }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .lang-switch { display: flex; gap: 6px; }
  .lang-btn {
    border: 1px solid var(--tm-border);
    background: #fff;
    border-radius: 20px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: var(--tm-muted);
  }
  .lang-btn.active { background: var(--tm-blue); color: #fff; border-color: var(--tm-blue); }
  #header-auth-slot { display: flex; align-items: center; gap: 10px; }
  #header-auth-slot .header-user {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--tm-ink);
    background: var(--tm-bg);
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--tm-border);
    text-decoration: none;
  }
  #header-auth-slot .header-login {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--tm-ink);
    text-decoration: none;
  }
  #header-auth-slot .btn.btn-light.btn-sm {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: var(--tm-blue);
    padding: 8px 14px;
    border-radius: 20px;
    text-decoration: none;
  }

  /* ---------- Auth card (in normal page flow — no overlay/modal) ---------- */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(24px, 6vw, 60px) 16px;
  }
  .auth-card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 1px solid var(--tm-border);
    border-radius: 16px;
    padding: clamp(24px, 5vw, 36px);
    box-shadow: 0 10px 30px rgba(20, 30, 50, .06);
  }
  .auth-eyebrow {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--tm-blue);
    text-transform: uppercase;
    margin: 0 0 8px;
  }
  .auth-card h1 {
    margin: 0 0 6px;
    font-size: clamp(22px, 5vw, 26px);
    font-weight: 800;
  }
  .auth-sub {
    margin: 0 0 22px;
    font-size: 14px;
    color: var(--tm-muted);
    line-height: 1.5;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--tm-ink);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--tm-border);
    border-radius: 9px;
    font-size: 15px;
    font-family: inherit;
    color: var(--tm-ink);
    background: #fff;
    transition: border-color .15s ease;
  }
  .field input:focus {
    outline: none;
    border-color: var(--tm-blue);
  }
  .btn-block {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--tm-blue);
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 4px;
    transition: background .15s ease;
  }
  .btn-block:hover { background: var(--tm-blue-dark); }
  .auth-foot {
    text-align: center;
    margin: 20px 0 0;
    font-size: 13.5px;
    color: var(--tm-muted);
  }
  .auth-foot a {
    color: var(--tm-blue);
    font-weight: 700;
    text-decoration: none;
  }
  .auth-foot a:hover { text-decoration: underline; }

  /* ---------- Footer ---------- */
  .site-footer {
    background: #111;
    color: #ccc;
    padding: 32px 0;
    font-size: 12.5px;
  }
  .site-footer .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: space-between;
  }
  .site-footer a { color: #ccc; text-decoration: none; margin-right: 12px; }
  .site-footer a:hover { color: #fff; }
  .footer-copy { width: 100%; margin-top: 16px; color: #777; font-size: 11.5px; }

  @media (max-width: 480px) {
    .main-nav { display: none; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand"><span class="tm-logo"><span class="tm-logo-mark">®</span><span>ticketmaster</span></span></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="event.html">Madrid Event</a>
      <a href="packages.html">Buy Tickets</a>
      <a href="tickets.html">My Tickets</a>
    </nav>
    <div class="header-actions">
      <div class="lang-switch">
        <button class="lang-btn" data-lang="es" onclick="setLanguage('es')" type="button">ES</button>
        <button class="lang-btn active" data-lang="en" onclick="setLanguage('en')" type="button">EN</button>
      </div>
      <div id="header-auth-slot"></div>
    </div>
  </div>
</header>

<main>
  <div class="auth-card">
    <p class="auth-eyebrow">JOIN TICKETMASTER</p>
    <h1>Create account</h1>
    <p class="auth-sub" id="auth-sub">Just tell us your name so we can personalize your dashboard.</p>
    <form id="signup-form">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Jane Doe" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Anything works" />
      </div>
      <button type="submit" class="btn-block">Create account</button>
    </form>
    <p class="auth-foot">Already have an account? <a href="login.html" id="login-link">Log in</a></p>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-left">
      <span class="tm-logo"><span class="tm-logo-mark">®</span><span>ticketmaster</span></span>
    </div>
    <div class="footer-links">
      <a href="#">Purchase Policy</a><a href="#">Privacy Policy</a><a href="#">Cookie Policy</a>
    </div>
    <div class="footer-copy">© 1999-2026 Ticketmaster. All rights reserved.</div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script>
  function setLanguage(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
    try { localStorage.setItem('tm_lang', lang); } catch (e) {}
  }
  const savedLang = (function(){ try { return localStorage.getItem('tm_lang') || 'en'; } catch (e) { return 'en'; } })();
  setLanguage(savedLang);

  // Honor a ?redirect= param so someone sent here from checkout lands back
  // on checkout right after creating their account.
  const redirectParams = new URLSearchParams(window.location.search);
  const redirectTarget = redirectParams.get('redirect') || 'account.html';
  if (redirectParams.get('redirect')) {
    document.getElementById('auth-sub').textContent = 'Tell us your name to continue with your purchase.';
    document.getElementById('login-link').href = 'login.html?redirect=' + encodeURIComponent(redirectTarget);
  }

  // No validation, no waiting: whatever's typed, this creates the account
  // and moves on immediately.
  document.getElementById("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    await Auth.signUp(name, email, password);
    window.location.href = redirectTarget;
  });
</script>
</body>
</html>
